name: deploy-b

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        run: |
          echo "$GCP_KEY" | base64 -d > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud config set project ${{ secrets.GCP_PROJECT }}
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Inspect B instance
        id: inspect
        env:
          INSTANCE: ${{ secrets.GCP_INSTANCE_B }}
          ZONE: ${{ secrets.GCP_ZONE_B }}
        run: |
          gcloud compute instances describe "$INSTANCE" --zone "$ZONE" \
            --format='value[separator=" | "](name,status,networkInterfaces[0].networkIP,networkInterfaces[0].accessConfigs[0].natIP)' || true
          IP=$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo "")
          echo "B_IP=$IP" >> "$GITHUB_OUTPUT"
          echo "external IP: $IP"

      - name: Generate SSH keypair + inject via metadata
        env:
          INSTANCE: ${{ secrets.GCP_INSTANCE_B }}
          ZONE: ${{ secrets.GCP_ZONE_B }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          ssh-keygen -t ed25519 -f /tmp/id_deploy -N "" -C "${SSH_USER}" >/dev/null
          chmod 600 /tmp/id_deploy
          PUB=$(cat /tmp/id_deploy.pub)
          # 用 metadata 注入公钥（绕过 gcloud compute ssh 对 SA 的 serviceAccountUser 检查）
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" \
            --metadata "ssh-keys=${SSH_USER}:${PUB}" --quiet
          echo "key injected via metadata"

      - name: Upload + run deploy script (plain ssh)
        id: deploy
        env:
          INSTANCE: ${{ secrets.GCP_INSTANCE_B }}
          ZONE: ${{ secrets.GCP_ZONE_B }}
          GH_REPO: Tang975/sub-cache-7f3k2
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          IP=$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "connecting to $SSH_USER@$IP"
          # 等 SSH 端口就绪
          for i in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                -i /tmp/id_deploy "$SSH_USER@$IP" 'true' 2>/dev/null; then
              echo "SSH ready (try $i)"
              break
            fi
            sleep 5
          done
          # 上传部署脚本
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/id_deploy deploy-machine.sh "$SSH_USER@$IP:/tmp/deploy-machine.sh"
          # 以 root 运行部署脚本（B 角色，只推送不合并）
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/id_deploy "$SSH_USER@$IP" \
            "sudo bash /tmp/deploy-machine.sh B '$GH_REPO' '$GH_TOKEN'"
          echo "deploy script completed"
